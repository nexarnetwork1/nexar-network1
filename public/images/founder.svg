<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E39E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8956C"/>
      <stop offset="100%" stop-color="#A0714F"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#D4AF3718"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="175" r="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle glow -->
  <ellipse cx="200" cy="180" rx="180" ry="160" fill="url(#glowGrad)"/>
  
  <!-- Outer ring decoration -->
  <circle cx="200" cy="175" r="120" stroke="#D4AF3720" stroke-width="1" fill="none"/>
  <circle cx="200" cy="175" r="108" stroke="#D4AF3710" stroke-width="1" fill="none" stroke-dasharray="4 6"/>

  <!-- Body / Suit -->
  <path d="M60 500 C60 370 140 340 200 330 C260 340 340 370 340 500Z" fill="url(#suitGrad)"/>
  
  <!-- Shirt collar area -->
  <path d="M170 330 L200 360 L230 330 L210 345 L200 380 L190 345 Z" fill="#f0f0f0" opacity="0.9"/>
  
  <!-- Tie -->
  <path d="M196 345 L200 380 L204 345 L200 350Z" fill="#D4AF37" opacity="0.8"/>
  
  <!-- Shoulders/jacket lapels -->
  <path d="M140 350 L170 330 L200 360 L230 330 L260 350 C240 340 220 345 200 350 C180 345 160 340 140 350Z" fill="#1e2040" opacity="0.9"/>

  <!-- Neck -->
  <rect x="185" y="265" width="30" height="70" rx="15" fill="url(#skinGrad)"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="210" rx="72" ry="80" fill="url(#skinGrad)"/>
  
  <!-- Hair (dark) -->
  <path d="M128 195 C128 145 172 115 200 115 C228 115 272 145 272 195 C272 185 264 175 256 178 C252 155 238 138 220 132 C210 129 190 129 180 132 C162 138 148 155 144 178 C136 175 128 185 128 195Z" fill="#1a0f0a"/>
  
  <!-- Side hair -->
  <path d="M128 195 C128 180 132 165 140 160 C138 175 136 190 136 210Z" fill="#1a0f0a"/>
  <path d="M272 195 C272 180 268 165 260 160 C262 175 264 190 264 210Z" fill="#1a0f0a"/>
  
  <!-- Ear left -->
  <ellipse cx="130" cy="215" rx="10" ry="13" fill="#B8784A"/>
  
  <!-- Ear right -->
  <ellipse cx="270" cy="215" rx="10" ry="13" fill="#B8784A"/>
  
  <!-- Eyes -->
  <!-- Left eye -->
  <ellipse cx="178" cy="208" rx="12" ry="9" fill="#fff" opacity="0.95"/>
  <circle cx="180" cy="209" r="6" fill="#2c1810"/>
  <circle cx="180" cy="209" r="3" fill="#1a0f08"/>
  <circle cx="182" cy="207" r="1.5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Right eye -->
  <ellipse cx="222" cy="208" rx="12" ry="9" fill="#fff" opacity="0.95"/>
  <circle cx="220" cy="209" r="6" fill="#2c1810"/>
  <circle cx="220" cy="209" r="3" fill="#1a0f08"/>
  <circle cx="222" cy="207" r="1.5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Eyebrows -->
  <path d="M165 196 Q178 190 191 194" stroke="#1a0f0a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M209 194 Q222 190 235 196" stroke="#1a0f0a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M196 218 Q193 232 190 238 Q200 242 210 238 Q207 232 204 218" stroke="#A0714F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Mouth - slight confident smile -->
  <path d="M183 252 Q200 262 217 252" stroke="#7A4A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M186 252 Q200 258 214 252" stroke="#8B3A2A" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Subtle beard/stubble shadow -->
  <path d="M160 248 Q200 275 240 248 Q240 268 200 278 Q160 268 160 248Z" fill="#5a3020" opacity="0.12"/>

  <!-- Gold accent border at bottom -->
  <rect x="0" y="490" width="400" height="10" fill="url(#goldGrad)" opacity="0.3"/>
  
  <!-- Gold dots decoration -->
  <circle cx="30" cy="30" r="2" fill="#D4AF37" opacity="0.3"/>
  <circle cx="370" cy="30" r="2" fill="#D4AF37" opacity="0.3"/>
  <circle cx="30" cy="470" r="2" fill="#D4AF37" opacity="0.3"/>
  <circle cx="370" cy="470" r="2" fill="#D4AF37" opacity="0.3"/>
</svg>
